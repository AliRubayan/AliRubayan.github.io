<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1330">
<meta name="description" content="وصل: سجل واحد والكل يشوفه. نموذج تفاعلي لمهاراثون ببيانات تجريبية.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="وصل">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>[hidden]{display:none!important}</style>
<title>وصل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@700;800;900&display=swap">
<style>
/* Layout: navy Wasl shell (switcher + shared log) framing three product views, each in its own brand: My Maharah gold phone, Dunkin-style client portal, Maharah console. Single deliberate light look inside a dark shell. */
:root{
  color-scheme:light;
  --night:#050A1F;--navy:#0A1330;--line-d:#1D2B63;--blue:#1633FF;--sky:#4C8DFF;--ice:#C9DBFF;--muted-d:#9FAACB;
  --paper:#F6F3EE;--card:#FFFFFF;--ink:#1F1A14;--ink2:#6B6157;--rule:#ECE6DD;
  --gold:#B08A4E;--gold2:#8E6C38;--goldbg:#F3EBDD;
  --dk-or:#FF671F;--dk-pk:#DA1884;--dk-br:#5A2D0C;--dk-bg:#FFF6F0;
  --good:#1E9E5A;--goodbg:#E6F6EC;--bad:#D23B3B;--badbg:#FDEBEB;--warn:#C27A0E;--warnbg:#FFF3DC;
  --display:'Cairo','IBM Plex Sans Arabic',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html,body{background:var(--night)}
body{font-family:var(--body);color:var(--ink);min-height:100vh;direction:rtl;
  background:radial-gradient(900px 600px at 100% 0%,#13248A55,transparent 60%),linear-gradient(180deg,var(--navy),var(--night)) fixed}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#0A1330F2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line-d)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--navy)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand svg{width:38px;height:38px}
.brand b{font-family:var(--display);font-weight:900;font-size:24px;line-height:1}
.brand small{display:block;color:var(--muted-d);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;background:#FFFFFF0D;padding:4px;border-radius:14px;overflow-x:auto;max-width:100%}
.tab{position:relative;white-space:nowrap;padding:9px 16px;border-radius:10px;color:var(--ice);font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.tab .dot{position:absolute;top:5px;left:6px;width:9px;height:9px;border-radius:50%;background:#FF5A6E;box-shadow:0 0 0 2px var(--navy)}
.top-end{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.pill-demo{font-size:12px;color:var(--ice);background:#FFFFFF14;padding:5px 12px;border-radius:999px;white-space:nowrap}
.btn-ghost{color:var(--ice);font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid var(--line-d);white-space:nowrap}
.btn-ghost:hover{background:#FFFFFF10}
.hint{max-width:1400px;margin:14px auto 0;color:var(--ice);font-size:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.6}
.hint b{color:#fff}
.hint i{flex:none;font-style:normal;background:var(--blue);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;margin-top:2px}
main{margin:0}
.disclaimer{max-width:1400px;margin:0 auto;padding-block:0 24px;color:var(--muted-d);font-size:12px;text-align:center;line-height:1.7}

/* ---------- landing ---------- */
.land{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:40px;color:#fff;text-align:center}
.land .lg svg{width:84px;height:84px}
.land h1{font-family:var(--display);font-weight:900;font-size:56px;margin:4px 0 0;line-height:1}
.land .tag{color:var(--muted-d);font-size:18px;margin:8px 0 0}
.land h2{font-size:16px;font-weight:600;color:var(--ice);margin:0}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,260px));gap:16px;width:100%;justify-content:center}
.role{background:#FFFFFF0C;border:1px solid var(--line-d);border-radius:22px;padding:22px 18px;display:grid;justify-items:center;gap:10px;color:#fff;transition:transform .15s,border-color .15s,background .15s}
.role:hover{transform:translateY(-3px);border-color:var(--sky);background:#FFFFFF14}
.role .rl{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:26px}
.role b{font-family:var(--display);font-size:21px}
.role span{color:var(--muted-d);font-size:13px;line-height:1.6}
.land .foot{color:var(--muted-d);font-size:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.land .foot button{color:var(--ice);text-decoration:underline}
.loading{min-height:100vh;min-height:100dvh;display:grid;place-items:center;color:#fff;font-size:16px}
.loading div{display:grid;justify-items:center;gap:14px}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid #ffffff33;border-top-color:#fff;animation:spin .8s linear infinite}
.tagdemo{font-size:11px;font-weight:600;color:var(--ink2);background:#F0ECE6;padding:3px 10px;border-radius:999px;white-space:nowrap}
.dk .tagdemo{background:#fff}
.out{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:12px;font-size:14px;text-align:start}
.out svg{width:19px;height:19px;flex:none}
.mh .out:hover{background:#F7F2EA}
.dk .out{color:#fff}.dk .out:hover{background:#ffffff1c}
@media (max-width:760px){.roles{grid-template-columns:1fr;max-width:420px}.land h1{font-size:44px}}

/* ---------- worker / phone ---------- */
.worker-stage{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;padding-block:20px}
.side-note{max-width:380px;color:#fff;padding-top:30px}
.side-note h2{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.25;margin:0 0 10px;text-wrap:balance}
.side-note h2 span{color:#E2C48F}
.side-note p{color:var(--muted-d);line-height:1.8;margin:0 0 16px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;color:var(--ice);font-size:14px;line-height:1.6}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:#FFFFFF14;display:grid;place-items:center;font-size:12px;color:#fff}
.steps li.done{color:#7FE0AE}
.steps li.done::before{content:"✓";background:#1E9E5A}
.phone{width:390px;max-width:100%;height:800px;border-radius:52px;background:#02050F;border:3px solid #2B3B78;padding:12px;box-shadow:0 40px 90px #0008;flex:none}
.screen{position:relative;height:100%;border-radius:40px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;padding:12px 26px 0;font-weight:700;font-size:14px;color:#fff;position:absolute;inset:0 0 auto;z-index:3}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#02050F;z-index:4}
.pscroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.phead{background:radial-gradient(260px 200px at 0% 30%,#ffffff22,transparent 70%),linear-gradient(160deg,#C4A06A,#9C7A44);padding:54px 18px 70px;color:#fff}
.hrow{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:14px;background:#ffffff33;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.hrow b{font-family:var(--display);font-size:20px;display:block}
.hrow small{opacity:.9;font-size:12px}
.bell{margin-inline-start:auto;width:40px;height:40px;border-radius:12px;background:#ffffff26;display:grid;place-items:center;position:relative}
.bell .dot{position:absolute;top:8px;left:9px;width:9px;height:9px;border-radius:50%;background:#FF5A6E}
.pbody{padding:0 14px 20px;margin-top:-56px;display:grid;gap:12px}
.pc{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 6px 22px #5a46280f}
.pc h3{margin:0;font-family:var(--display);font-size:17px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.mut{color:var(--ink2);font-size:12px}
.bigbtn{width:100%;margin-top:14px;padding:15px;border-radius:16px;background:linear-gradient(180deg,#B8925A,#9C7A44);color:#fff;font-family:var(--display);font-weight:800;font-size:19px;box-shadow:0 8px 20px #9c7a4455}
.bigbtn:hover{filter:brightness(1.05)}
.onshift{margin-top:14px;padding:12px;border-radius:14px;background:var(--goodbg);color:var(--good);font-weight:700;text-align:center}
.sal{display:flex;align-items:center;gap:12px;margin:12px 0}
.sal .rl{width:52px;height:52px;border-radius:14px;background:var(--goodbg);color:var(--good);display:grid;place-items:center;font-weight:800;font-size:14px}
.sal b{font-family:var(--display);font-weight:900;font-size:36px;color:var(--good);line-height:1}
.sal b.bump{animation:bump .9s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.15);color:#14b86a}100%{transform:scale(1)}}
.li{display:flex;align-items:center;gap:8px;background:#F7F3EC;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
.li .amt{margin-inline-start:auto;font-weight:700}
.plus{color:var(--good)}.minus{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.gold{background:var(--goldbg);color:var(--gold2);border:1px solid #d9c39f}
.chip.good{background:var(--goodbg);color:var(--good)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.blue{background:#E8EEFF;color:#1633FF}
.chip.grey{background:#F0ECE6;color:var(--ink2)}
button.chip.gold:hover{background:#ead9bb}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{width:74px;height:74px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;color:var(--gold2);background:conic-gradient(var(--gold) var(--p),#EFE7DA 0);position:relative}
.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.ring span{position:relative;z-index:1;line-height:1.3}
.note{border:1px solid #d9c39f;background:#FFFBF3}
.bnav{display:flex;justify-content:space-around;align-items:center;background:#fff;border-top:1px solid var(--rule);padding:8px 6px 18px}
.bnav button{display:grid;justify-items:center;gap:3px;font-size:11px;color:#9a9087;min-width:56px}
.bnav button[aria-current="true"]{color:var(--gold2);font-weight:700}
.bnav svg{width:22px;height:22px}
.bnav .plusb{width:44px;height:44px;border-radius:14px;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:24px}
.overlay{position:absolute;inset:0;z-index:10;background:#1f1a1466;display:flex;align-items:flex-end}
.overlay.full{background:var(--paper);align-items:center;justify-content:center}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:20px 18px 26px;display:grid;gap:10px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:0;font-family:var(--display)}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--rule);font-size:14px;text-align:start}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--goldbg)}
.goldbtn{padding:13px;border-radius:14px;background:var(--gold);color:#fff;font-weight:700}
.goldbtn[disabled]{opacity:.45;cursor:not-allowed}
.verify{text-align:center;padding:30px;display:grid;justify-items:center;gap:12px}
.vicon{width:130px;height:130px;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;position:relative;color:var(--gold)}
.vicon.scan::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid transparent;border-top-color:var(--gold);animation:spin 1s linear infinite}
.vicon.ok{border-color:var(--good);color:var(--good);background:var(--goodbg)}
@keyframes spin{to{transform:rotate(360deg)}}
.verify h3{font-family:var(--display);font-size:22px;margin:4px 0 0}
.vlist{display:grid;gap:8px;width:100%;max-width:280px;margin-top:8px}
.vlist div{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:10px 12px;font-size:13px}
.geo{width:220px;height:130px;border-radius:16px;background:#EFE8DC;position:relative;overflow:hidden}
.geo .zone{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#1E9E5A22;border:2px dashed #1E9E5A}
.geo .me{position:absolute;left:56%;top:44%;width:16px;height:16px;border-radius:50%;background:#1633FF;border:3px solid #fff;box-shadow:0 0 0 6px #1633FF33}
.geo .br{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;background:#fff;padding:2px 6px;border-radius:6px;margin-top:22px;white-space:nowrap}
.notif{display:flex;gap:10px;align-items:flex-start}
.notif .ic{width:36px;height:36px;border-radius:10px;background:var(--goldbg);color:var(--gold2);display:grid;place-items:center;flex:none;font-weight:800}
.notif p{margin:2px 0 0;font-size:13px;line-height:1.6;color:var(--ink2)}
.qiwa{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:10px;background:#0F6E52;color:#fff;font-size:13px;font-weight:700;text-decoration:none}
.empty{padding:26px 10px;text-align:center;color:var(--ink2);font-size:13px}

/* ---------- dashboards ---------- */
.dash{display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--card);min-height:100vh;min-height:100dvh}
.sb{display:flex;flex-direction:column;gap:4px;padding:18px 14px;border-inline-start:1px solid var(--rule)}
.dk .sb{background:linear-gradient(180deg,#FF7A35,var(--dk-or));color:#fff;border:0}
.sbb{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.sbb .lg{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px}
.mh .sbb .lg{background:linear-gradient(160deg,#C4A06A,#8E6C38);color:#fff;font-size:22px}
.dk .sbb .lg{background:#fff;color:var(--dk-pk);font-size:15px;letter-spacing:-.5px}
.sbb b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.sbb small{font-size:11px;opacity:.8}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-size:15px;text-align:start;width:100%}
.nav svg{width:19px;height:19px;flex:none}
.nav .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px}
.mh .nav{color:#4a4037}
.mh .nav:hover{background:#F7F2EA}
.mh .nav[aria-current="true"]{background:var(--goldbg);color:var(--gold2);font-weight:700}
.dk .nav{color:#fff}
.dk .nav:hover{background:#ffffff1c}
.dk .nav[aria-current="true"]{background:#fff;color:var(--dk-or);font-weight:700}
.sbfoot{margin-top:auto;padding:12px;border-radius:14px;font-size:12px;line-height:1.5}
.mh .sbfoot{background:#F7F2EA}
.dk .sbfoot{background:#ffffff22}
.content{padding:22px 24px 30px;background:#FBFAF7;min-width:0;display:flex;flex-direction:column;gap:16px}
.dk .content{background:var(--dk-bg)}
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chead h2{margin:0;font-family:var(--display);font-size:26px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--good);background:var(--goodbg);padding:4px 10px;border-radius:999px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.chead .end{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.or{background:var(--dk-or);color:#fff}
.btn.pk{background:var(--dk-pk);color:#fff}
.btn.gd{background:var(--gold);color:#fff}
.btn.ol{border:1px solid var(--rule);background:#fff}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.gn{background:var(--good);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:14px 16px}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi b{display:block;font-family:var(--display);font-weight:900;font-size:32px;line-height:1.2;margin-top:4px}
.kpi small{font-size:12px;font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.panel{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-family:var(--display);font-size:17px;display:flex;align-items:center;gap:8px}
.panel h3 .mut{margin-inline-start:auto;font-family:var(--body);font-weight:500}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--ink2);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #F2EEE8;white-space:nowrap}
tr.flag td{background:#FFF1EA}
tr.flag td:first-child{box-shadow:inset -4px 0 0 var(--dk-or)}
tr.hl td{animation:hl 2.4s ease}
@keyframes hl{0%,40%{background:#FFF4CF}100%{background:transparent}}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:#F8F5F0;margin-bottom:8px}
.item.new{animation:hl 2.4s ease}
.item b{font-size:14px}
.item .mut{display:block;margin-top:2px}
.item .acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--badbg);border:1px solid #f3c4c4;flex-wrap:wrap}
.alert.ok{background:var(--goodbg);border-color:#bfe6cd}
.alert b{font-size:14px}
.mapbox{position:relative;border-radius:14px;overflow:hidden;background:#F3E9DF;aspect-ratio:16/10;max-width:100%}
.mapbox svg{width:100%;height:100%;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.6}
.msg.me{align-self:flex-start;background:var(--dk-or);color:#fff;border-end-start-radius:4px}
.msg.bot{align-self:flex-end;background:#fff;border:1px solid var(--rule);border-end-end-radius:4px}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qs button{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid #f5c7ae;background:#fff;color:var(--dk-br)}
.inrow{display:flex;gap:8px}
input[type=text],select,textarea{font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:#fff;color:var(--ink);width:100%;min-width:0}
label.f{display:grid;gap:6px;font-size:13px;color:var(--ink2)}
.modal{position:fixed;inset:0;z-index:50;background:#050A1Fa6;display:grid;place-items:center;padding:16px}

.api{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:20px 6px}
.node{border:1px solid var(--rule);border-radius:18px;padding:18px;text-align:center;background:#fff}
.node .lg{width:54px;height:54px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:24px;color:#fff}
.wire{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--ink2);min-width:110px}

@keyframes flow{to{background-position:-14px 0}}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#F4EFE7;padding:2px 6px;border-radius:6px;direction:ltr;display:inline-block}

/* ---------- shared log & toasts ---------- */
.logbtn{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--blue);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 12px 30px #1633ff66;display:flex;gap:8px;align-items:center}
.logbtn span{background:#fff;color:var(--blue);border-radius:999px;padding:0 8px;font-size:12px}
.drawer{position:fixed;left:0;top:0;bottom:0;width:380px;max-width:100%;z-index:45;background:var(--navy);border-inline-end:1px solid var(--line-d);color:#fff;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:20px 0 60px #0008}
.drawer h3{font-family:var(--display);margin:0;font-size:20px}
.drawer p{color:var(--muted-d);font-size:13px;margin:6px 0 14px;line-height:1.6}
.ev{border-top:1px solid var(--line-d);padding:12px 0;font-size:14px;line-height:1.6}

.ev .who{font-size:11px;padding:2px 8px;border-radius:999px;background:#FFFFFF14;color:var(--ice);margin-inline-end:6px}
.toasts{position:fixed;z-index:60;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;gap:8px;width:min(460px,calc(100% - 32px))}
.toast{background:#0A1330;color:#fff;border:1px solid #2B3B78;border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 14px 40px #0008;animation:up .25s ease;line-height:1.6}
.toast b{color:#9CC4FF}

}

const BR=[ // Dunkin branches (sample)

 days:21, daily:190, allow:235,
 ded:{id:4613,label:'تأخير 20 دقيقة · الأربعاء',amt:45,status:'active',reason:''},
 wnotes:[],
 branches:BR.map(b=>({...b})),

/* ---------- helpers ---------- */

}
function toast(h){const t=document.createElement('div');t.className='toast';t.innerHTML=h;const box=document.getElementById('toasts');box.appendChild(t);while(box.children.length>2)box.firstChild.remove();setTimeout(()=>t.remove(),4500)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- WORKER ---------- */
function stepsDone(){return [S.shift==='on',S.ded.status!=='active',S.wnotes.some(n=>n.kind==='renew')]}
function worker(){

function cKpis(){

   <div class="kpi"><span>ساعات العمل هالأسبوع</span><b class="num">${fmt(684+(S.shift==='on'?8:0))}</b><small style="color:var(--ink2)">من الحضور الذكي</small></div>

function bStatus(b){
  if(b.id==='nakheel'&&S.absent.status==='replacement')return `<span class="chip blue">بديل في الطريق</span>`;
  if(b.here<b.need)return `<span class="chip bad">● ${b.need-b.here} ما حضر</span>`;
  return `<span class="chip good">● مكتمل</span>`;
}
function map(){
  const dots=S.branches.map(b=>{const c=b.id==='nakheel'&&S.absent.status==='replacement'?'#1633FF':b.here<b.need?'#D23B3B':'#1E9E5A';
    return `<g><circle cx="${b.x}" cy="${b.y}" r="16" fill="${c}" opacity=".18"/><circle cx="${b.x}" cy="${b.y}" r="7" fill="${c}"/><text x="${b.x}" y="${b.y-14}" text-anchor="middle" font-size="12" fill="#5A2D0C" font-family="IBM Plex Sans Arabic">${b.n.replace('فرع ','')} ${b.here}/${b.need}</text></g>`}).join('');
  return `<div class="mapbox"><svg viewBox="0 0 640 400" role="img" aria-label="خريطة الفروع"><rect width="640" height="400" fill="#F3E9DF"/>
   <path d="M0 300 C160 280 260 320 640 250" stroke="#fff" stroke-width="14" fill="none"/><path d="M340 0 C330 120 360 260 300 400" stroke="#fff" stroke-width="14" fill="none"/><path d="M80 0 L140 400" stroke="#fff" stroke-width="8" fill="none"/><path d="M0 140 L640 110" stroke="#fff" stroke-width="8" fill="none"/>
   <text x="20" y="385" font-size="12" fill="#a88" font-family="IBM Plex Sans Arabic">الرياض · مواقع تقريبية</text>${dots}</svg></div>
   <div class="legend"><span><i style="background:#1E9E5A"></i>مكتمل</span><span><i style="background:#D23B3B"></i>فيه غياب</span><span><i style="background:#1633FF"></i>بديل في الطريق</span></div>`;
}
function bTable(rows){

}

function cAI(){
  const qs=['كم عامل حاضر الحين؟','وين وصل طلبي؟','ليش فيه فرق في الفاتورة؟','متى تخلص عقود عمالي؟'];

   <p class="mut" style="margin:10px 0 0">يجاوب من السجل نفسه. اللي ما يقدر يجاوبه يحوّله تذكرة لمدير حسابك في مهارة.</p>

function answer(q){
  const s=q.replace(/[؟?]/g,'');
  if(/حاضر|حضور الحين|كم عامل/.test(s))return `حاضرين الحين <b class="num">${presentDunkin()}</b> من <b class="num">${needDunkin()}</b> في 12 فرع.${S.absent.status==='open'?' سالم في فرع النخيل ما حضر، ومهارة شافت التنبيه.':' بديل سالم في الطريق لفرع النخيل.'}`;
  if(/طلب/.test(s)){const r=S.reqs[0];return r?`آخر طلب: <b>${r.type} · ${r.branchName}</b>. حالته: ${r.status==='done'?'اعتمدته مهارة وتم التنفيذ ✓':'وصل مهارة وقيد المتابعة.'}`:'ما رفعت طلبات اليوم. تقدر ترفع طلب عامل إضافي أو بديل أو شكوى من زر «طلب جديد».'}
  if(/فاتور|فرق/.test(s))return S.sheet==='none'?'ارفع شيت حضوركم من «مطابقة الحضور» وأطابقه لك مع الحضور الذكي وأبيّن أي فرق قبل الفاتورة.':'الفرق يوم واحد في فرع العليا: عامل حاضر بتحقق الهوية والموقع وما انسجل في شيتكم. '+(S.sheet==='approved'?'واعتمدتوا المطابقة ✓':'تقدر تعتمد المطابقة من صفحتها.');
  if(/عقد|عقود|تجديد/.test(s))return '3 عقود تخلص خلال 3 شهور. مهارة ترسل تذكير للعامل نفسه ويجدد عبر قوى، وأنت تشوف الحالة هنا.';
  return null;
}

   ${ws.map(w=>`<tr class="${w[0]==='كريم'&&S.flash.payk?'hl':''}"><td><b>${w[0]}</b></td><td>${w[2]}</td><td class="num">${w[3]}</td><td class="num">${w[5]?'−'+w[5]:'—'}</td><td class="num"><b>${fmt(w[3]*w[4]+235-w[5])}</b></td><td>${S.payroll==='generated'?'<span class="chip good">جاهز للصرف</span>':(w[0]==='كريم'&&S.ded.status==='disputed')?'<span class="chip warn">فيه اعتراض</span>':'<span class="chip grey">مسودة</span>'}</td></tr>`).join('')}
   </tbody></table></div><p class="mut" style="margin:10px 0 0">نفس الأرقام اللي يشوفها كل عامل في «راتبك المتوقع».</p></div>
   <div class="panel"><h3>فاتورة دانكن · نوفمبر</h3>${S.payroll==='generated'?`<div class="inv">
     <div class="row"><span>أيام عمل محققة (عيّنة 4 عمال)</span><b class="num">${invDays}</b></div>
     <div class="row"><span>سعر اليوم (تجريبي)</span><b class="num">${rate} ريال</b></div>
     <div class="row"><span>المجموع قبل الضريبة</span><b class="num">${fmt(invDays*rate)}</b></div>
     <div class="row"><span>ضريبة القيمة المضافة 15%</span><b class="num">${fmt(Math.round(invDays*rate*.15))}</b></div>
     <div class="row tot"><span>الإجمالي</span><span class="num">${fmt(Math.round(invDays*rate*1.15))} ريال</span></div>
     <div class="row"><span class="chip good">جاهزة للإرسال لزاتكا (محاكاة)</span><span class="chip blue">نفس سجل الحضور</span></div></div>`
     :`<div class="empty">اضغط «ولّد الرواتب والفاتورة».<br>الاثنين يطلعون من نفس سجل الحضور، فما يصير فرق بين اللي انصرف للعامل واللي انفوتر على العميل.</div>`}</div>
  </div>`;
}
function mContracts(){
  return `<div class="chead"><h2>العقود والتجديد</h2><span class="live">تذكير يوصل للعامل نفسه</span></div>
  <div class="panel"><h3>تخلص خلال 3 شهور<span class="mut">بيانات تجريبية</span></h3>
   ${S.reminders.map(r=>`<div class="item ${S.flash['rm_'+r.id]?'new':''}"><span class="chip gold">${r.left}</span><div><b>${r.name} · ${r.what}</b><span class="mut">ينتهي ${r.ends} · دانكن</span></div><div class="acts">${r.sent?'<span class="chip good">✓ وصله التذكير · محوّل لقوى</span>':`<button class="btn gd sm" data-act="remind" data-v="${r.id}">أرسل تذكير للعامل</button>`}</div></div>`).join('')}
   <p class="mut" style="margin:8px 0 0">التذكير يطلع في تطبيق My Maharah عند العامل مع زر يوديه لقوى يجدد. الربط مع قوى نفسه محاكاة في هذا النموذج.</p>
  </div>`;
}
function mApi(){
  return `<div class="chead"><h2>التكامل</h2><span class="live">API · متصل (محاكاة)</span></div>
  <div class="panel"><div class="api">
   <div class="node"><div class="lg" style="background:linear-gradient(160deg,#C4A06A,#8E6C38)">م</div><b>نظام مهارة الأساسي</b><div class="mut">العقود، العمال، العملاء</div></div>
   <div class="wire"><span>API</span><i></i><span>تزامن لحظي</span></div>
   <div class="node"><div class="lg" style="background:linear-gradient(160deg,#4C8DFF,#1633FF)">و</div><b>وصل</b><div class="mut">الحضور الذكي، الطلبات، الرواتب</div></div>
  </div>
  <h3 style="margin-top:6px">أمثلة على النقاط (توضيحية)</h3>
  <div class="tw"><table><tbody>
   <tr><td><code>GET /workers/{id}/contract</code></td><td>وصل يقرأ العقد والراتب من نظام مهارة</td></tr>
   <tr><td><code>POST /attendance</code></td><td>كل بداية شفت محققة ترجع للنظام الأساسي</td></tr>
   <tr><td><code>POST /payroll/run</code></td><td>مسير الرواتب يطلع من نفس سجل الحضور</td></tr>

  <p class="mut" style="margin:10px 0 0">وصل طبقة فوق أنظمة مهارة الحالية، ما يستبدلها. الربط مع قوى وأجير وزاتكا محاكاة في هذا النموذج.</p></div>`;
}

/* ---------- modal (client request) ---------- */
function modalHtml(){
  if(S.modal!=='newreq')return '';
  const m=S.mreq;
  return `<div class="modal" data-act="close-bg"><form class="mbox" id="reqf" role="dialog" aria-label="طلب جديد">
   <h3>طلب جديد</h3>
   <div class="seg">${['عامل إضافي','بديل','شكوى'].map(t=>`<button type="button" data-act="rtype" data-v="${t}" aria-pressed="${m.type===t}">${t}</button>`).join('')}</div>
   <label class="f">الفرع<select id="rbranch">${S.branches.map(b=>`<option value="${b.id}" ${m.branch===b.id?'selected':''}>${b.n}</option>`).join('')}</select></label>
   <label class="f">ملاحظة<input type="text" id="rnote" value="${esc(m.note)}" placeholder="${m.type==='شكوى'?'وش المشكلة؟':'مثلًا: الخميس 4 م إلى 12 ص · كاشير'}"></label>
   <button class="btn pk" type="submit">إرسال الطلب لمهارة</button>
   <button class="btn ol" type="button" data-act="close">إلغاء</button>
  </form></div>`;
}

/* ---------- render ---------- */
const HINTS={
 worker:'<i>جرّب</i><span>اضغط <b>«ابدأ الشفت»</b> في تطبيق كريم، وبعدين افتح <b>لوحة دانكن</b> أو <b>لوحة مهارة</b> وشوف حضوره وصل لهم.</span>',
 client:'<i>جرّب</i><span>ارفع <b>طلب جديد</b>، اسأل <b>مدير الحساب الذكي</b>، أو طابق <b>شيت الحضور</b>. كل شي يوصل للوحة مهارة. (دانكن هنا مثال توضيحي)</span>',
 maharah:'<i>جرّب</i><span>أرسل <b>بديل</b> للغايب، اقبل <b>اعتراض كريم</b>، ولّد <b>الرواتب والفاتورة</b>، وأرسل <b>تذكير تجديد</b>. شوف كيف يتحدث تطبيق كريم ولوحة دانكن.</span>'
};
function landing(){
  return `<div class="land wrap">
   <div class="lg"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C8DFF"/><stop offset="1" stop-color="#1633FF"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#wg)"/><path d="M17 41C24 19 40 19 47 41" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><circle cx="17" cy="43" r="6.5" fill="#fff"/><circle cx="47" cy="43" r="6.5" fill="#fff"/></svg>
   <h1>وصل</h1><p class="tag">سجل واحد… والكل يشوفه</p></div>
   <h2>ادخل كـ</h2>
   <div class="roles">
     <button class="role" data-act="enter" data-v="worker"><div class="rl" style="background:linear-gradient(160deg,#C4A06A,#8E6C38)">ك</div><b>عامل</b><span>كريم · تطبيق My Maharah</span></button>
     <button class="role" data-act="enter" data-v="client"><div class="rl" style="background:#fff;color:#DA1884;font-size:20px">DD</div><b>عميل</b><span>دانكن · بوابة العميل</span></button>
     <button class="role" data-act="enter" data-v="maharah"><div class="rl" style="background:linear-gradient(160deg,#C4A06A,#8E6C38)">م</div><b>مهارة</b><span>مدير الحساب</span></button>
   </div>
   <div class="foot"><span>بيانات تجريبية · دانكن مثال توضيحي · الربط مع قوى وزاتكا محاكاة</span><button id="installBtn" hidden>ثبّت التطبيق</button>${S.log.length?'<button data-act="reset">ابدأ من جديد</button>':''}</div>
  </div>`;
}
function render(){
  if(S.loading){app.innerHTML=`<div class="loading"><div><div class="spin"></div>جارٍ تسجيل الدخول…</div></div>`;document.getElementById('modal').innerHTML='';return}
  app.innerHTML=S.view==='home'?landing():{worker,client,maharah}[S.view]();
  document.title=S.view==='home'?'وصل':{worker:'My Maharah · كريم',client:'دانكن · بوابة العميل',maharah:'مهارة · لوحة وصل'}[S.view];
  document.getElementById('modal').innerHTML=modalHtml();
  const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;
  S.flash={};
  save();
}
function go(v){S.view=v;S.modal=null;try{history.pushState(null,'',v==='home'?location.pathname:'#'+v)}catch(e){location.hash=v==='home'?'':v}render();window.scrollTo({top:0})}

/* ---------- actions ---------- */
function startShift(){
  S.shift='verifying';S.verifyStep=0;render();
  const seq=[[1100,1],[1900,2],[3000,3],[4100,4]];
  seq.forEach(([ms,st])=>setTimeout(()=>{
    if(st<4){S.verifyStep=st;render();return}
    S.shift='on';S.days=22;
    const m=S.branches.find(b=>b.id==='malqa');m.here=Math.min(m.need,m.here+1);
    S.flash={sal:1,b_malqa:1,w_كريم:1,dk:1};
    render();
    emit('كريم بدأ الشفت 8:02 في دانكن · فرع الملقا. الهوية ✓ والموقع داخل النطاق ✓. راتبه المتوقع صار '+fmt(expected())+' ريال.',['worker','client','maharah'],'بدأ شفتك ✓');
  },ms));
}
function ask(q){
  if(!q.trim())return;
  S.chat.push({me:true,t:q});
  let a=answer(q);
  if(!a){const id='q'+Date.now();S.tickets.unshift({id,kind:'سؤال',title:'دانكن · '+q,sub:'من مدير الحساب الذكي · يحتاج رد',done:false,src:'client'});S.flash['t_'+id]=1;
    a='سؤالك يحتاج مدير حسابك، حوّلته له تذكرة في مهارة الحين. بتلقى الرد هنا.';S.chat.push({me:false,t:a});render();emit('دانكن سأل مدير الحساب الذكي، وتحوّل السؤال تذكرة لمهارة.',['client','maharah'],'تحوّل سؤالك لمدير حسابك');return}
  S.chat.push({me:false,t:a});render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='close-bg'&&e.target!==el)return;
  switch(a){
   case 'reset':S=fresh();save();go('home');break;
   case 'enter':S.loading=true;render();setTimeout(()=>{S.loading=false;S.wtab='home';S.ctab='home';S.mtab='home';go(v)},650);break;
   case 'logout':go('home');break;
   case 'soon':toast('هذي الخدمة غير متاحة في النسخة التجريبية.');break;
   case 'wtab':S.wtab=v;if(v==='reqs')S.wnotes.forEach(n=>n.read=true);render();break;
   case 'start':startShift();break;
   case 'dispute':S.modal='dispute';S.pick=null;render();break;
   case 'reason':S.pick=v;render();break;
   case 'close':case 'close-bg':S.modal=null;render();break;
   case 'send-dispute':S.ded.status='disputed';S.ded.reason=S.pick;S.modal=null;S.flash.disp=1;render();emit('كريم اعترض على خصم التأخير #4613 (45 ريال) من التطبيق.',['worker','maharah'],'انرسل اعتراضك لمهارة');break;
   case 'disp-ok':S.ded.status='refunded';S.wnotes.unshift({kind:'ok',title:'انقبل اعتراضك ✓',body:'رجعنا خصم التأخير 45 ريال، وراتبك المتوقع صار '+fmt(expected())+' ريال.',read:false});S.flash.payk=1;render();emit('مهارة قبلت اعتراض كريم ورجع 45 ريال. راتبه المتوقع صار '+fmt(expected())+' ريال.',['maharah','worker'],'قبلت الاعتراض ورجع المبلغ للعامل');break;
   case 'disp-no':S.ded.status='rejected';S.wnotes.unshift({kind:'no',title:'تمت مراجعة اعتراضك',body:'الخصم باقي حسب سجل الحضور. تقدر تتواصل مع مدير حسابك.',read:false});render();emit('مهارة راجعت اعتراض كريم وأبقت الخصم.',['maharah','worker'],'رفضت الاعتراض');break;
   case 'ctab':S.ctab=v;render();break;
   case 'mtab':S.mtab=v;render();break;
   case 'newreq':S.modal='newreq';S.mreq={type:'عامل إضافي',branch:'olaya',note:''};render();break;
   case 'rtype':S.mreq.type=v;S.mreq.branch=document.getElementById('rbranch').value;S.mreq.note=document.getElementById('rnote').value;render();break;
   case 'approve-req':{const r=S.reqs.find(x=>x.id===v);r.status='done';S.flash['r_'+r.id]=1;render();emit('مهارة اعتمدت طلب دانكن ('+r.type+' · '+r.branchName+') ونفّذته.',['maharah','client'],'اعتمدت الطلب ✓');break}
   case 'ticket-done':{const t=S.tickets.find(x=>x.id===v);t.done=true;t.sub='رد مدير الحساب ✓';S.chat.push({me:false,t:'مدير حسابك في مهارة رد على سؤالك: تم ✓ وتواصلنا معكم بالتفاصيل.'});render();emit('مدير الحساب في مهارة رد على سؤال دانكن.',['maharah','client'],'انرسل الرد للعميل');break}
   case 'send-repl':{S.absent.status='replacement';S.flash.b_nakheel=1;S.flash['w_سالم']=1;S.reqs.unshift({id:'rp'+Date.now(),type:'بديل',branch:'nakheel',branchName:'فرع النخيل',note:'بديل تلقائي لغياب سالم',status:'done',t:time()});render();emit('مهارة شافت غياب سالم وأرسلت بديل لدانكن · فرع النخيل.',['maharah','client'],'انرسل بديل لفرع النخيل');break}
   case 'loadsheet':S.sheet='loaded';render();emit('دانكن رفع شيت حضور نوفمبر، ووصل طابقه: فيه فرق يوم في فرع العليا.',['client','maharah'],'انرفع الشيت وتمت المطابقة');break;
   case 'approvesheet':S.sheet='approved';render();emit('دانكن اعتمد مطابقة الحضور. الفاتورة تطلع على نفس الأرقام.',['client','maharah'],'اعتمدت المطابقة ✓');break;
   case 'gen':S.payroll='generated';render();emit('مهارة ولّدت مسير الرواتب وفاتورة دانكن من نفس سجل الحضور.',['maharah','client','worker'],'تم توليد الرواتب والفاتورة');break;
   case 'remind':{const r=S.reminders.find(x=>x.id===v);r.sent=true;S.flash['rm_'+r.id]=1;
     if(r.name==='كريم')S.wnotes.unshift({kind:'renew',title:'عقدك يخلص بعد 3 شهور',body:'عقد العمل ينتهي 29 يناير 2027. جدّده عن طريق قوى قبل لا يفوتك.',read:false});
     render();emit('مهارة أرسلت تذكير تجديد ('+r.what+') لـ'+r.name+'، والتذكير يوديه لقوى.',r.name==='كريم'?['maharah','worker']:['maharah'],'انرسل التذكير لـ'+r.name);break}
   case 'ask':ask(v);break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='askf'){const i=document.getElementById('askin');ask(i.value);return}
  if(e.target.id==='reqf'){
    const b=document.getElementById('rbranch').value,n=document.getElementById('rnote').value.trim();
    const br=S.branches.find(x=>x.id===b);const id='r'+Date.now();
    S.reqs.unshift({id,type:S.mreq.type,branch:b,branchName:br.n,note:n,status:'open',t:time()});
    S.modal=null;S.flash['r_'+id]=1;S.ctab='reqs';render();
    emit('دانكن رفع طلب '+S.mreq.type+' لـ'+br.n+' من البوابة.',['client','maharah'],'انرسل طلبك لمهارة');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.drawer)){S.modal=null;S.drawer=false;render()}});
function fromHash(){const h=(location.hash||'').slice(1);S.view=['worker','client','maharah'].includes(h)?h:'home';S.modal=null;render()}
window.addEventListener('hashchange',fromHash);window.addEventListener('popstate',fromHash);
window.addEventListener('storage',e=>{if(e.key!==KEY)return;const keep={};TRANSIENT.forEach(k=>keep[k]=S[k]);S=Object.assign(load(),keep);S.flash={};render()});
fromHash();
})();
</script>

<div class="modal" id="iosHint" hidden><div class="mbox"><h3>ثبّت وصل على جوالك</h3><p style="margin:0;line-height:1.9">في سفاري اضغط زر <b>المشاركة</b>، بعدين <b>«إضافة إلى الشاشة الرئيسية»</b>.<br>في أندرويد من قائمة كروم اختر <b>«تثبيت التطبيق»</b>.</p><button class="btn gd" id="iosClose">تمام</button></div></div>
<script>
(function(){
  if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
  let dp=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  function sync(){const b=document.getElementById('installBtn');if(b)b.hidden=standalone}
  new MutationObserver(sync).observe(document.getElementById('app'),{childList:true});sync();
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
  document.addEventListener('click',async e=>{
    if(e.target.id==='installBtn'){e.stopPropagation();if(dp){dp.prompt();await dp.userChoice;dp=null}else document.getElementById('iosHint').hidden=false}
    if(e.target.id==='iosClose')document.getElementById('iosHint').hidden=true;
  },true);
})();
</script>
